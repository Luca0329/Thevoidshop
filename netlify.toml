[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Frontend deployment settings
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://thevoidshop.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mystical-status"
  to = "https://thevoidshop.railway.app/mystical-status"
  status = 200
  force = true
