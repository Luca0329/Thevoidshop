[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Frontend deployment settings
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy to Railway backend with proper headers
[[redirects]]
  from = "/api/*"
  to = "https://thevoidshop.railway.app/api/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "https://thevoidshop.netlify.app"}

[[redirects]]
  from = "/mystical-status"
  to = "https://thevoidshop.railway.app/mystical-status"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "https://thevoidshop.netlify.app"}

[[redirects]]
  from = "/health"
  to = "https://thevoidshop.railway.app/health"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "https://thevoidshop.netlify.app"}
